[project]
name = "convergent-cross-mapping-for-causal-inference-in-p"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "copulas>=0.14.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pandas-datareader>=0.10.0",
    "scipy>=1.17.1",
    "setuptools>=75.0.0",
    "statsmodels>=0.14.6",
    "yfinance>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
